slots:
  default:
  - component: div
    config:
      style:
        align-items: center
        display: flex
        gap: 8px
    slots:
      default:
      - component: div
        config:
          style:
            align-items: center
            display: flex
            flex: 0 0 auto
            height: 26px
            justify-content: center
            position: relative
            width: 26px
          visible: =!!props.ring
        slots:
          default:
          - component: svg
            config:
              height: 26.0
              style:
                inset: '0'
                position: absolute
              viewBox: 0 0 26 26
              width: 26.0
            slots:
              default:
              - component: circle
                config:
                  cx: 13.0
                  cy: 13.0
                  fill: none
                  r: 10.0
                  stroke: =props.color
                  stroke-opacity: 0.25
                  stroke-width: 3.0
              - component: circle
                config:
                  cx: 13.0
                  cy: 13.0
                  fill: none
                  opacity: '=Number(items[props.item].numericState) > 0 ? 1 : 0'
                  r: 10.0
                  stroke: =props.color
                  stroke-dasharray: =Math.min(1, Math.max(0, Number(items[props.item].numericState)) / (Number(props.ringFull)
                    || Number(props.max))) * 62.83 + ' 62.83'
                  stroke-linecap: round
                  stroke-width: 3.0
                  transform: rotate(-90 13 13)
          - component: oh-icon
            config:
              height: 14.0
              icon: material:timer
              width: 14.0
      - component: div
        config:
          style:
            align-items: center
            background: color-mix(in srgb, var(--pill-color) 20%, transparent)
            border-radius: 50%
            display: flex
            flex: 0 0 auto
            height: 26px
            justify-content: center
            width: 26px
          visible: =!props.ring
        slots:
          default:
          - component: oh-icon
            config:
              height: 15.0
              icon: =props.icon || 'material:tune'
              width: 15.0
      - component: div
        config:
          style:
            display: flex
            flex: '1'
            flex-direction: column
            min-width: '0'
        slots:
          default:
          - component: Label
            config:
              style:
                font-size: 13px
                line-height: 16px
              text: =props.title
          - component: Label
            config:
              style:
                font-size: 11px
                line-height: 14px
                opacity: '0.7'
                overflow: hidden
                text-overflow: ellipsis
                white-space: nowrap
              text: =props.context || ''
      - component: Label
        config:
          style:
            color: '=props.valueColor !== undefined ? props.valueColor : props.color'
            font-size: 15px
            font-weight: '700'
            white-space: nowrap
          text: =props.value
  - component: div
    config:
      style:
        min-height: 32px
    slots:
      default:
      - component: oh-slider
        config:
          draggableBar: false
          item: =props.item
          label: true
          limitKnobPosition: true
          max: =Number(props.max)
          min: =Number(props.min)
          releaseOnly: true
          step: =Number(props.step)
          unit: =props.unit
          visible: =!Number.isNaN(Number.parseFloat(items[props.item].state))
  - component: div
    config:
      style:
        height: 13px
        position: relative
    slots:
      default:
      - component: oh-repeater
        config:
          for: mark
          fragment: true
          in: =(props.marks || '').split(';')
          sourceType: array
        slots:
          default:
          - component: Label
            config:
              style:
                font-size: 10px
                left: =(Number(loop.mark.split('=')[0]) - Number(props.min)) / (Number(props.max) - Number(props.min)) * 100
                  + '%'
                opacity: '0.55'
                position: absolute
                transform: '=loop.mark_idx === 0 ? ''translateX(0)'' : loop.mark_idx === loop.mark_source.length - 1 ? ''translateX(-100%)''
                  : ''translateX(-50%)'''
                white-space: nowrap
              text: =loop.mark.split('=')[1]
