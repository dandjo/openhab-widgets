uid: state-bar
tags:
- controls
props:
  parameters:
  - name: item
    label: Item
    description: The item whose states the segments send
    type: TEXT
    required: true
    context: item
  - name: options
    label: Options
    description: value=label pairs separated by semicolons, e.g. 1=Low;2=Medium;3=High
    type: TEXT
    required: true
  - name: color
    label: Colour
    description: 'Colour of the current segment as #rrggbb; may be an expression'
    type: TEXT
    required: false
    default: '#78909c'
  - name: byText
    label: Sized by text
    description: Segments as wide as their labels instead of equal widths
    type: BOOLEAN
    required: false
  - name: flex
    label: Flex
    description: CSS flex of the bar in a row, e.g. 1 1 240px
    type: TEXT
    required: false
  - name: width
    label: Width
    description: CSS width of the bar
    type: TEXT
    required: false
    default: 100%
  parameterGroups: []
