              right: '20'
          xAxis:
          - component: oh-time-axis
            config:
              gridIndex: 0
          yAxis:
          - component: oh-category-axis
            config:
              gridIndex: 0
              categoryType: values
              data: =[props.title]
              show: false
          series:
          - component: oh-state-series
            config:
              name: =props.title
              item: =props.item
              xAxisIndex: 0
              yAxisIndex: 0
              yValue: 0
              mapState: =(s) => ((props.states || 'ON=On,OFF=Off').split(',').map((o) => o.trim().split('=')).find((o) =>
                o[0] === s) || [s, s])[1]
              tooltip:
                formatter: '=(p) => p.value && p.value.length > 3 ? ''<div'' + '' style="font-size: 12px; line-height: 18px;
                  margin: 0 -10px 6px; padding: 0 10px 6px; border-bottom: 1px solid; border-bottom-color: inherit">'' + dayjs(p.value[1]).format(''llll'')
                  + '' – '' + dayjs(p.value[2]).format(dayjs(p.value[2]).isSame(p.value[1], ''day'') ? ''HH:mm'' : ''llll'')
                  + ''</div>'' + p.marker + '' '' + p.seriesName + ''<span style="float: right; margin-left: 20px"><b>'' +
                  p.value[3] + '' · '' + (((p.value[2] - p.value[1]) / 60000) >= 60 ? Math.floor(((p.value[2] - p.value[1])
                  / 60000) / 60) + '':'' + (Math.floor(((p.value[2] - p.value[1]) / 60000) % 60) < 10 ? ''0'' : '''') + Math.floor(((p.value[2]
                  - p.value[1]) / 60000) % 60) + '' h'' : Math.round(((p.value[2] - p.value[1]) / 60000)) + '' min'') + ''</b></span>''
                  : '''''
          tooltip:
          - component: oh-chart-tooltip
            config:
              show: true
              confine: true
              transitionDuration: 0
              borderColor: '=themeOptions.dark === ''dark'' ? ''rgb(91, 94, 100)'' : ''rgb(183, 185, 190)'''
