uid: item-popup
tags:
- popup
props:
  parameters:
  - context: item
    description: The item to show
    label: Item
    name: item
    required: true
    type: TEXT
  - description: Title of the popup, the tile's
    label: Title
    name: title
    required: false
    type: TEXT
  - default: '#5c6bc0'
    description: 'Colour of the course as #rrggbb'
    label: Colour
    name: color
    required: false
    type: TEXT
  - default: number
    description: 'number: its course as a line; state: a band of its states; none: only the value'
    label: Kind
    name: kind
    required: false
    type: TEXT
  - description: value=label pairs, comma-separated, for the band of states
    label: State labels
    name: states
    required: false
    type: TEXT
  - context: item
    description: A second item, shown beside the first and as a second line
    label: Second item
    name: item2
    required: false
    type: TEXT
  - description: 'The first item''s name beside a second item; empty: the title'
    label: Name
    name: name
    required: false
    type: TEXT
  - description: The second item's name
    label: Second name
    name: name2
    required: false
    type: TEXT
  - default: '#78909c'
    description: 'Colour of the second item''s value and line as #rrggbb'
    label: Second colour
    name: color2
    required: false
    type: TEXT
  - default: 'false'
    description: Draw the second item's line dashed, for a reference such as the first one's mean
    label: Second dashed
    name: dashed2
    required: false
    type: BOOLEAN
  - context: item
    description: A third item, such as a meter's third phase, beside the others and as a third line
    label: Third item
    name: item3
    required: false
    type: TEXT
  - description: The third item's name
    label: Third name
    name: name3
    required: false
    type: TEXT
  - default: '#78909c'
    description: 'Colour of the third item''s value and line as #rrggbb'
    label: Third colour
    name: color3
    required: false
    type: TEXT
  - context: item
    description: A fourth item, such as the neutral conductor; four values stand two by two on a phone
    label: Fourth item
    name: item4
    required: false
    type: TEXT
  - description: The fourth item's name
    label: Fourth name
    name: name4
    required: false
    type: TEXT
  - description: 'Colour of the fourth item''s value and line as #rrggbb; empty: a grey of the theme'
    label: Fourth colour
    name: color4
    required: false
    type: TEXT
  - default: 'false'
    description: Draw the fourth item's line dashed, for a reference such as the neutral conductor
    label: Fourth dashed
    name: dashed4
    required: false
    type: BOOLEAN
  - default: 'false'
    description: Each item's course in a chart of its own, one under the other on one time axis and one scale, with one pointer
      and tooltip; otherwise the lines overlap in one chart
    label: Stacked
    name: stacked
    required: false
    type: BOOLEAN
  - default: 'false'
    description: Show the values without their sign and draw their amounts from 0, e.g. the load of lines whose meter signs
      the direction
    label: Amounts
    name: abs
    required: false
    type: BOOLEAN
  - default: 'false'
    description: Fit the value axis to the values instead of starting it at 0, e.g. for voltages
    label: Fitted axis
    name: scale
    required: false
    type: BOOLEAN
  - default: 'false'
    description: 'Values of 0 and below are no reading: the course leaves them out and the tooltip gives a dash, e.g. a day''s
      COP before the day''s first run'
    label: Positive only
    name: positive
    required: false
    type: BOOLEAN
  - default: 'false'
    description: The course over the calendar day from midnight, its arrows a day each, instead of the last 24 hours, for
      a value that starts again at midnight
    label: Calendar day
    name: today
    required: false
    type: BOOLEAN
  - description: 'Show the value large inside a ring, as a device page''s head, the ring filled in the colour up to the value
      / this, e.g. 6 for a COP; empty: the value alone'
    label: Ring full at
    name: ring
    required: false
    type: DECIMAL
  - description: Small text under the value inside the ring, e.g. the day the value covers
    label: Caption
    name: caption
    required: false
    type: TEXT
  - context: item
    description: An item shown beside the ring with one decimal, e.g. the heat a COP is the ratio of
    label: First fact
    name: fact1
    required: false
    type: TEXT
  - description: The first fact's name
    label: First fact's name
    name: factName1
    required: false
    type: TEXT
  - context: item
    description: A second item beside the ring, e.g. the electricity a COP is the ratio of
    label: Second fact
    name: fact2
    required: false
    type: TEXT
  - description: The second fact's name
    label: Second fact's name
    name: factName2
    required: false
    type: TEXT
  - context: item
    description: 'The String item the rule tile_history writes the tiles'' history into: beside the ring the value''s whole
      day yesterday'
    label: History item
    name: history
    required: false
    type: TEXT
  - context: item
    description: 'A Location item: a map (OpenStreetMap) around where it stands, on top'
    label: Location
    name: map
    required: false
    type: TEXT
  - context: item
    description: A String item holding trips by day as JSON (rule skoda_enyaq_status), listed under the map as the MyŠkoda
      app's travel history
    label: Trips
    name: trips
    required: false
    type: TEXT
  - context: item
    description: A String item holding a learnt heating curve as JSON (rule heatpump_heating_curve), drawn as a chart on top
      with item (outdoor) and item2 (setpoint) as the present point
    label: Heating curve
    name: curve
    required: false
    type: TEXT
  parameterGroups: []
