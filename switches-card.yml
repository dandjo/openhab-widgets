              color: '#fbc02d'
              value: =Math.round((Number(items[props.terraceLightPower].numericState) || 0)) + ' W'
              energy: =((Number(items[props.terraceLightEnergyToday].numericState) || 0)).toFixed(2) + ' kWh'
