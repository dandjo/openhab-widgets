timestamp: Oct 4, 2026, 11:05:34 PM
component: oh-card
config:
  title: Switches
  style:
    height: calc(100% - 2 * var(--f7-card-margin-vertical))
slots:
  content:
  - component: div
    config:
      style:
        padding: 12px 16px 16px
    slots:
      default:
      - component: div
        config:
          style:
            display: grid
            gap: 6px
            grid-template-columns: '=screen.width < 600 ? ''repeat(3, minmax(0, 1fr))'' : ''repeat(5, minmax(0, 1fr))'''
        slots:
          default:
          - component: widget:switch-tile
            config:
              item: =props.coffeeMachineSwitch
              title: Coffee
              icon: material:coffee
              color: '#8d6e63'
              value: =Math.round((Number(items[props.coffeeMachinePower].numericState) || 0)) + ' W'
              energy: =((Number(items[props.coffeeMachineEnergyToday].numericState) || 0)).toFixed(2) + ' kWh'
          - component: widget:switch-tile
            config:
              item: =props.bicycleBatteriesSwitch
              title: E-Bikes
              icon: material:electric_bike
              color: '#7cb342'
              value: =Math.round((Number(items[props.bicycleBatteriesPower].numericState) || 0)) + ' W'
              energy: =((Number(items[props.bicycleBatteriesEnergyToday].numericState) || 0)).toFixed(2) + ' kWh'
          - component: widget:switch-tile
            config:
              item: =props.office1Switch
              title: Office 1
              icon: material:computer
              color: '#ab47bc'
              value: =Math.round((Number(items[props.office1Power].numericState) || 0)) + ' W'
              energy: =((Number(items[props.office1EnergyToday].numericState) || 0)).toFixed(2) + ' kWh'
          - component: widget:switch-tile
            config:
