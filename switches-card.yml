              energy: =((Number(items[props.office2EnergyToday].numericState) || 0)).toFixed(2).replace('.', ',') + ' kWh'
          - component: widget:switch-tile
            config:
              item: =props.terraceLightSwitch
              title: Terrasse
              icon: material:light
              color: '#fbc02d'
              value: =Math.round((Number(items[props.terraceLightPower].numericState) || 0)) + ' W'
