                + ' g/m³ · indoors ' + ((6.112 * Math.exp(17.67 * (Number(items[props.netatmoWeatherstationTemperature].numericState)
                || 0) / ((Number(items[props.netatmoWeatherstationTemperature].numericState) || 0) + 243.5)) * (Number(items[props.netatmoWeatherstationAtmosphericHumidity].numericState)
                || 0) * 2.1674 / (273.15 + (Number(items[props.netatmoWeatherstationTemperature].numericState) || 0)))).toFixed(1)
                + ' g/m³'
              style:
                font-size: 12px
                opacity: '0.6'
