uid: grid-peaks-month
tags:
- popup
props:
  parameters:
  - name: peaks
    label: Peaks
    description: The String item holding the grid's strongest quarter-hours by month as JSON (rule grid_peaks)
    type: TEXT
    required: true
    context: item
  - name: month
    label: Month
    description: The month's key, as 2026-11
    type: TEXT
    required: true
  parameterGroups: []
timestamp: Nov 2, 2026, 1:25:21 PM
component: div
config:
  style:
    padding: 8px 6px
  stylesheet: '@keyframes a-soft { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.06; } }

    @keyframes a-full { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    @keyframes a-arc { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

    @keyframes a-halo { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

    @keyframes a-halo-arc { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @keyframes a-fade { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

    @keyframes a-glow { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

    @keyframes a-blink-up { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

    @keyframes a-blink-down { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    @keyframes a-flicker-a { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    @keyframes a-flicker-b { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

    @keyframes a-flicker-c { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    @keyframes a-bolt { 0%, 66.7%, 100% { opacity: 1; } 33.3% { opacity: 0.35; } }

    @keyframes a-breathe { 0%, 100% { transform: scale(0.82); } 50% { transform: scale(1.05); } }

    @keyframes a-spin { to { transform: rotate(360deg); } }

    @keyframes a-wobble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

    @keyframes a-rise { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    @keyframes a-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    @keyframes a-ripple { from { transform: scale(1); opacity: 0.7; } to { transform: scale(var(--grow)); opacity: 0; } }

    @keyframes a-run { from { transform: translate(var(--ax), var(--ay)); } to { transform: translate(var(--bx), var(--by));
    } }

    @keyframes a-drop { 0% { transform: translate(0, 0); opacity: 0; } 25% { opacity: 1; } 75% { opacity: 1; } 100% { transform:
    translate(-2px, 6px); opacity: 0; } }

    @keyframes a-bubble-l { 0% { transform: translate(0.00px, 0.00px) scale(1.00); opacity: 0; } 15% { opacity: 0.9; } 25%
    { transform: translate(0.42px, -5.84px) scale(1.33); } 50% { transform: translate(0.00px, -11.50px) scale(1.67); } 70%
    { opacity: 0.9; } 75% { transform: translate(-0.42px, -17.16px) scale(2.00); } 100% { transform: translate(0.00px, -23.00px)
    scale(2.33); opacity: 0; } }

    @keyframes a-bubble-r { 0% { transform: translate(0.00px, 0.00px) scale(1.00); opacity: 0; } 15% { opacity: 0.9; } 25%
    { transform: translate(-0.42px, -5.84px) scale(1.33); } 50% { transform: translate(0.00px, -11.50px) scale(1.67); } 70%
    { opacity: 0.9; } 75% { transform: translate(0.42px, -17.16px) scale(2.00); } 100% { transform: translate(0.00px, -23.00px)
    scale(2.33); opacity: 0; } }

    .a-soft { animation: a-soft 2s linear infinite; }

    .a-full { animation: a-full 2s linear infinite; }

    .a-arc { animation: a-arc 2s linear infinite; }

    .a-halo { animation: a-halo 2s linear infinite; }

    .a-halo-arc { animation: a-halo-arc 2s linear infinite; }

    .a-fade { animation: a-fade 2.4s linear infinite; }

    .a-glow { animation: a-glow 2.4s linear infinite; }

    .a-blink-up { animation: a-blink-up 1.8s ease-in-out infinite; }

    .a-blink-down { animation: a-blink-down 1.8s ease-in-out infinite; }

    .a-flicker-a { animation: a-flicker-a 0.9s linear infinite; }

    .a-flicker-b { animation: a-flicker-b 1.3s linear infinite; }

    .a-flicker-c { animation: a-flicker-c 2s linear infinite; }

    .a-bolt { animation: a-bolt 1.8s linear infinite; }

    .a-breathe { transform-box: fill-box; transform-origin: center; animation: a-breathe 2.4s ease-in-out infinite; }

    .a-spin { transform-box: fill-box; transform-origin: center; animation: a-spin 1s linear infinite; }

    .a-wobble { animation: a-wobble 2s linear infinite; }

    .a-rise { animation: a-rise 1s linear infinite; }

    .a-fill { transform-box: fill-box; transform-origin: left center; animation: a-fill 2.4s linear infinite; }

    .a-ripple { transform-box: fill-box; transform-origin: center; animation: a-ripple 1.6s linear infinite; }

    .a-run { animation: a-run 2.5s linear infinite; }

    .a-drop { animation: a-drop 0.9s linear infinite; }

    .a-bubble-l { transform-box: fill-box; transform-origin: center; animation: a-bubble-l 2.6s linear infinite; }

    .a-bubble-r { transform-box: fill-box; transform-origin: center; animation: a-bubble-r 2.6s linear infinite; }

    '
slots:
  default:
  - component: div
    config:
      style:
        padding: 6px 10px 10px
    slots:
      default:
      - component: Label
        config:
          text: =(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November',
            'December'])[Number((props.month || '').slice(5, 7)) - 1] + ' ' + (props.month || '').slice(0, 4)
          style:
            font-size: 20px
            font-weight: '700'
      - component: Label
        config:
          text: The 7 strongest days, each with its strongest quarter-hour
          style:
            font-size: 14px
            opacity: '0.65'
  - component: div
    config:
      style:
        padding: 0 4px
    slots:
      default:
      - component: oh-repeater
        config:
          for: day
          sourceType: array
          in: '=((x) => x ? x.d : [])((((s) => ((s || '''').charAt(0) === ''{'' ? JSON.parse(s).months || [] : []).find((x)
            => x.m === props.month))(props.peaks ? items[props.peaks].state : '''')))'
          fragment: true
        slots:
          default:
          - component: div
            config:
              style:
                background: rgba(127, 127, 127, 0.12)
                border-radius: 12px
                padding: 10px 12px
                margin-bottom: 8px
                position: relative
            slots:
              default:
              - component: div
                config:
                  style:
                    display: flex
                    justify-content: space-between
                    align-items: baseline
                    gap: 8px
                slots:
                  default:
                  - component: div
                    config:
                      style:
                        min-width: '0'
                    slots:
                      default:
                      - component: Label
                        config:
                          text: =((d) => d.format('dd DD.MM.') + ' · ' + d.format('HH:mm') + '–' + d.add(15, 'minute').format('HH:mm'))(dayjs(loop.day.t))
                          style:
                            font-weight: '700'
                  - component: Label
                    config:
                      text: =loop.day.kw.toFixed(2) + ' kW'
                      style:
                        font-weight: '700'
                        font-size: 17px
                        color: '#e53935'
                        white-space: nowrap
              - component: div
                config:
                  style:
                    display: flex
                    gap: 2px
                    height: 12px
                    margin: 8px 0 6px
                    width: '=(100 * loop.day.p.reduce((a, x) => a + x[1], 0) / Math.max(0.001, ((x) => x ? x.max : 0)((((s)
                      => ((s || '''').charAt(0) === ''{'' ? JSON.parse(s).months || [] : []).find((x) => x.m === props.month))(props.peaks
                      ? items[props.peaks].state : ''''))) || 0)).toFixed(1) + ''%'''
                slots:
                  default:
                  - component: oh-repeater
                    config:
                      for: part
                      sourceType: array
                      in: =loop.day.p
                      fragment: true
                    slots:
                      default:
                      - component: div
                        config:
                          style:
                            width: =(100 * loop.part[1] / Math.max(0.001, loop.day.p.reduce((a, x) => a + x[1], 0))).toFixed(2)
                              + '%'
                            height: 100%
                            background: '=((c) => c ? c[1] : ''#bdbdbd'')([[''Wärmepumpe'', ''#ffb74d''], [''E-Auto'', ''#26a69a''],
                              [''Klimaanlage'', ''#4fc3f7''], [''Büros'', ''#ce93d8''], [''Netzwerk'', ''#9fa8da''], [''Lüftung'',
                              ''#80cbc4''], [''Kühlschrank'', ''#b0bec5''], [''Kaffeemaschine'', ''#bcaaa4''], [''Wohnzimmer
                              Medien'', ''#f48fb1''], [''Wäsche & Geschirr'', ''#aed581''], [''Terrasse & Fahrräder'', ''#fff176''],
                              [''Nicht gemessen'', (themeOptions.dark === ''dark'') ? ''#e0e0e0'' : ''#9e9e9e''], [''Akku
                              laden'', ''#4db6ac'']].find((c) => c[0] === loop.part[0]))'
                            border-radius: 3px
                        slots:
                          default: []
              - component: div
                config:
                  style:
                    font-size: 11px
                    opacity: '0.65'
                    display: flex
                    flex-wrap: wrap
                    align-items: center
                    gap: 4px 12px
                slots:
                  default:
                  - component: oh-repeater
                    config:
                      for: part
                      sourceType: array
                      fragment: true
                      in: =loop.day.p.filter((x) => x[1] >= 0.1).slice(0, 4)
                    slots:
                      default:
                      - component: div
                        config:
                          style:
                            display: flex
                            align-items: center
                            gap: 5px
                            white-space: nowrap
                        slots:
                          default:
                          - component: div
                            config:
                              style:
                                width: 8px
                                height: 8px
                                border-radius: 50%
                                flex: 0 0 auto
                                background: '=((c) => c ? c[1] : ''#bdbdbd'')([[''Wärmepumpe'', ''#ffb74d''], [''E-Auto'',
                                  ''#26a69a''], [''Klimaanlage'', ''#4fc3f7''], [''Büros'', ''#ce93d8''], [''Netzwerk'', ''#9fa8da''],
                                  [''Lüftung'', ''#80cbc4''], [''Kühlschrank'', ''#b0bec5''], [''Kaffeemaschine'', ''#bcaaa4''],
                                  [''Wohnzimmer Medien'', ''#f48fb1''], [''Wäsche & Geschirr'', ''#aed581''], [''Terrasse
                                  & Fahrräder'', ''#fff176''], [''Nicht gemessen'', (themeOptions.dark === ''dark'') ? ''#e0e0e0''
                                  : ''#9e9e9e''], [''Akku laden'', ''#4db6ac'']].find((c) => c[0] === loop.part[0]))'
                            slots:
                              default: []
                          - component: Label
                            config:
                              text: =loop.part[0] + ' ' + loop.part[1].toFixed(1) + ' kW'
                  - component: Label
                    config:
                      text: ='PV covered ' + loop.day.pv.toFixed(1) + ' kW'
                      style:
                        white-space: nowrap
                      visible: =loop.day.pv >= 0.1
