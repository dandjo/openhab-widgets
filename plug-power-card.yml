uid: plug-power-card
tags:
- plug
props:
  parameters:
  - name: prefix
    label: Item prefix
    description: 'Name prefix of the plug''s items: <prefix>_power, _switch, _energy_today, _energy_total, _voltage, _current,
      _power_factor, _apparent_power, _reactive_power'
    type: TEXT
    required: true
  - name: color
    label: Colour
    description: 'Device colour as #rrggbb'
    type: TEXT
    required: false
    default: '#8d6e63'
  parameterGroups: []
timestamp: Oct 10, 2026, 5:24:26 PM
component: oh-card
config:
  title: Power today
  style:
    height: calc(100% - 2 * var(--f7-card-margin-vertical))
    display: flex
    flex-direction: column
  contentStyle:
    flex: 1 1 auto
    display: flex
    flex-direction: column
  stylesheet: '.menu-item-dropdown:not(.menu-item-dropdown-opened) .menu-dropdown { display: none; }

    .oh-chart-container > .menu.padding { padding-top: 6px !important; }'
slots:
  content:
  - component: div
    config:
      style:
        position: relative
        flex: 1 1 auto
        min-height: 260px
    slots:
      default:
      - component: div
        config:
          style:
            position: absolute
            inset: '0'
        slots:
          default:
          - component: oh-chart
            config:
              chartType: ''
              periodVisible: true
              period: D
              height: 100%
              options:
                backgroundColor: transparent
            slots:
              grid:
              - component: oh-chart-grid
                config:
                  top: '62'
                  bottom: '35'
                  left: '50'
                  right: '20'
              xAxis:
              - component: oh-time-axis
                config:
                  gridIndex: 0
              yAxis:
              - component: oh-value-axis
                config:
                  gridIndex: 0
                  name: W
                  nameGap: 14
                  nameTextStyle:
                    align: right
                    padding:
                    - 0
                    - 8
                    - 0
                    - 0
                  splitLine:
                    lineStyle:
                      type: dashed
                      opacity: 0.4
              series:
              - component: oh-time-series
                config:
                  name: Power
                  gridIndex: 0
                  xAxisIndex: 0
                  yAxisIndex: 0
                  type: line
                  item: =props.prefix + '_power'
                  symbol: none
                  sampling: lttb
                  lineStyle:
                    width: 1.5
                    color: =props.color
                  itemStyle:
                    color: =props.color
                  areaStyle:
                    color:
                      type: linear
                      x: 0
                      y: 0
                      x2: 0
                      y2: 1
                      colorStops:
                      - offset: 0
                        color: ='rgba(' + Number.parseInt(props.color.slice(1, 3), 16) + ', ' + Number.parseInt(props.color.slice(3,
                          5), 16) + ', ' + Number.parseInt(props.color.slice(5, 7), 16) + ', 0.45)'
                      - offset: 1
                        color: ='rgba(' + Number.parseInt(props.color.slice(1, 3), 16) + ', ' + Number.parseInt(props.color.slice(3,
                          5), 16) + ', ' + Number.parseInt(props.color.slice(5, 7), 16) + ', 0.02)'
