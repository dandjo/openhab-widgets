              mapState: '=(s) => s === ''ON'' ? ''An'' : s === ''OFF'' ? ''Aus'' : s'
              stateColor:
                An: '#fb8c00'
                Aus: '=themeOptions.dark === ''dark'' ? ''#3c3c3c'' : ''#e0e0e0'''
          tooltip:
          - component: oh-chart-tooltip
            config:
              show: true
              confine: true
          title:
          - component: oh-chart-title
            config:
              show: true
              text: Zusatzheizung
              left: 10
              top: 15
              textStyle:
                fontSize: 13
                fontWeight: 600
      - component: div
        config:
          style:
            display: flex
            justify-content: flex-end
            padding-top: 4px
        slots:
          default:
          - component: oh-button
            config:
              text: Alle Details
              action: popup
              actionModal: page:heatpump
              outline: true
              small: true
              style:
                color: '#e57373'
                border-color: '#e57373'
                width: auto
                padding: 0 12px
