                type: dashed
                color: '#e57373'
              itemStyle:
                color: '#e57373'
          tooltip:
          - component: oh-chart-tooltip
            config:
              show: true
              confine: true
              trigger: axis
              smartFormatter: true
          legend:
          - component: oh-chart-legend
            config:
              show: true
              bottom: '0'
              type: scroll
          title:
          - component: oh-chart-title
            config:
              show: true
              text: Temperatur und Soll
              left: 10
              top: 15
              textStyle:
                fontSize: 13
                fontWeight: 600
      - component: oh-chart
        config:
          chartType: ''
          periodVisible: true
          period: D
          height: 160px
        slots:
          grid:
          - component: oh-chart-grid
            config:
              top: '62'
              bottom: '35'
              left: '20'
              right: '20'
          xAxis:
          - component: oh-time-axis
            config:
              gridIndex: 0
          yAxis:
          - component: oh-category-axis
            config:
              gridIndex: 0
              categoryType: values
              data:
              - Zusatzheizung
              show: false
          series:
          - component: oh-state-series
            config:
              name: Zusatzheizung
              item: =props.heatpumpBshMode
              xAxisIndex: 0
              yAxisIndex: 0
