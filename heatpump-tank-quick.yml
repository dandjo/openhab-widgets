                config:
                  icon: material:propane_tank
                  width: 20
                  height: 20
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
                min-width: '0'
            slots:
              default:
              - component: Label
                config:
                  text: Warmwasserspeicher
                  style:
                    font-size: 15px
                    font-weight: '600'
              - component: Label
