                    || items[props.heatpumpDhwTankTemp].state)) + '' · Soll '' + ([''NULL'', ''UNDEF''].includes(items[props.heatpumpDhwSetpoint].state)
                    ? ''–'' : (items[props.heatpumpDhwSetpoint].displayState || items[props.heatpumpDhwSetpoint].state)) +
                    '' · Zusatzheizung '' + (items[props.heatpumpBshMode].state === ''ON'' ? ''an'' : ''aus'')'
                  style:
                    font-size: 12px
                    opacity: '0.7'
                    white-space: nowrap
                    overflow: hidden
                    text-overflow: ellipsis
      - component: oh-chart
        config:
          chartType: ''
          periodVisible: true
          period: D
          height: 270px
        slots:
