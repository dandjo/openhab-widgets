              color: '=items[props.acSwitch].state === ''ON'' ? ''#29b6f6'' : ''#90a4ae'''
              byText: true
              flex: 1 1 100%
      - component: div
        config:
          style:
            display: flex
            flex-direction: column
            gap: 6px
            padding: 8px 2px 10px
