            ''running until '' + dayjs().add((Number(items[props.acTimer].numericState) || 0), ''minute'').format(''HH:mm''))
            : (items[props.acSwitch].state === ''ON'' ? ''running without timer'' : ''6 h when switched on'')'
          marks: 0=0;180=3 h;360=6 h;540=9 h;720=12 h
          ring: true
          ringFull: =Math.max((Number(items[props.acTimer].numericState) || 0), (Number(items[props.acTimerSet].numericState)
            || 0) || 720)
          valueColor: '=(Number(items[props.acTimer].numericState) || 0) > 0 ? ''#29b6f6'' : '''''
          row: true
