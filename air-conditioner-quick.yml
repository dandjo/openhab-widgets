          default:
          - component: oh-button
            config:
              text: All details
              action: popup
              actionModal: page:air_conditioning
              outline: true
              small: true
              style:
                color: '#29b6f6'
                border-color: '#29b6f6'
                width: auto
                padding: 0 12px
