          max: 30
          step: 0.5
          unit: °C
          title: Target
          value: '=((Number(items[props.acTemperatureSetpoint].numericState) || 0) % 1 ? ((Number(items[props.acTemperatureSetpoint].numericState)
            || 0)).toFixed(1) : (Number(items[props.acTemperatureSetpoint].numericState) || 0)) + '' °C'''
          context: '=''Room '' + ([''NULL'', ''UNDEF''].includes(items[props.acTemperature].state) ? ''–'' : (items[props.acTemperature].displayState
            || items[props.acTemperature].state))'
          marks: 18=18 °C;20=20;22=22;24=24;26=26;28=28;30=30 °C
          icon: material:device_thermostat
          row: true
      - component: widget:pill-slider
        config:
          item: =props.acTimer
          color: '#29b6f6'
          min: 0
          max: 720
          step: 15
          unit: min
          title: Timer
          value: '=(Number(items[props.acTimer].numericState) || 0) > 0 ? ((Number(items[props.acTimer].numericState) || 0)
            >= 60 ? Math.floor((Number(items[props.acTimer].numericState) || 0) / 60) + '' h'' + (Math.round((Number(items[props.acTimer].numericState)
            || 0) % 60) ? '' '' + Math.round((Number(items[props.acTimer].numericState) || 0) % 60) + '' min'' : '''') : Math.round((Number(items[props.acTimer].numericState)
            || 0)) + '' min'') : ''Off'''
          context: '=(Number(items[props.acTimer].numericState) || 0) > 0 ? (items[props.acSwitch].state === ''ON'' ? ''switching
