uid: weather-card
tags:
- overview
props:
  parameters:
  - name: weatherCode
    label: Wetter aktuell
    description: Number item
    type: TEXT
    required: true
    context: item
  - name: weatherIsDay
    label: Wetter Tag
    description: Switch item
    type: TEXT
    required: true
    context: item
  - name: weatherWarningLevel
    label: Wetterwarnung Stufe
    description: Number item
    type: TEXT
    required: true
    context: item
  - name: heatpumpExtAmbientTemp
    label: ESPAltherma Außentemperatur
    description: Number:Temperature item
    type: TEXT
    required: true
    context: item
  - name: weatherDay0Min
    label: Wetter heute Min.
    description: Number:Temperature item
    type: TEXT
    required: true
    context: item
  - name: weatherDay0Max
    label: Wetter heute Max.
    description: Number:Temperature item
    type: TEXT
    required: true
    context: item
  - name: weatherDay1Min
    label: Wetter morgen Min.
    description: Number:Temperature item
    type: TEXT
    required: true
    context: item
  - name: weatherDay1Max
    label: Wetter morgen Max.
    description: Number:Temperature item
    type: TEXT
    required: true
    context: item
  - name: weatherDay2Min
    label: Wetter übermorgen Min.
    description: Number:Temperature item
    type: TEXT
    required: true
    context: item
  - name: weatherDay2Max
    label: Wetter übermorgen Max.
    description: Number:Temperature item
    type: TEXT
    required: true
    context: item
  parameterGroups: []
timestamp: Sep 28, 2026, 10:34:11 AM
component: oh-card
config:
  contentStyle:
    padding: 8px 14px
slots:
  content:
  - component: div
    config:
      style:
        position: relative
        display: flex
        align-items: center
        gap: 12px
        padding: 2px 4px
    slots:
      default:
      - component: div
        config:
          style:
            display: flex
            align-items: center
            gap: 8px
        slots:
          default:
          - component: widget:weather-icon
            config:
              code: =items[props.weatherCode].state
              day: =items[props.weatherIsDay].state !== 'OFF'
              size: 36
          - component: svg
            config:
              viewBox: 0 0 24 24
              width: 16
              height: 16
              style:
                display: block
                flex: 0 0 auto
                margin-left: -14px
                align-self: flex-start
              visible: =Number(items[props.weatherWarningLevel].state) > 0
            slots:
              default:
              - component: path
                config:
                  d: M12,2.6 L22.4,20.6 H1.6 Z
                  fill: =['#9e9e9e', '#fdd835', '#fb8c00', '#e53935'][Number(items[props.weatherWarningLevel].state)] || '#9e9e9e'
                  stroke: =['#9e9e9e', '#fdd835', '#fb8c00', '#e53935'][Number(items[props.weatherWarningLevel].state)] ||
                    '#9e9e9e'
                  stroke-width: 2.4
                  stroke-linejoin: round
              - component: rect
                config:
                  x: 10.9
                  y: 8.2
                  width: 2.2
                  height: 7
                  rx: 1.1
                  fill: '#212121'
              - component: circle
                config:
                  cx: 12
                  cy: 18
                  r: 1.3
                  fill: '#212121'
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
            slots:
              default:
              - component: Label
                config:
                  text: '=([''NULL'', ''UNDEF''].includes(items[props.heatpumpExtAmbientTemp].state) ? ''–'' : (items[props.heatpumpExtAmbientTemp].displayState
                    || items[props.heatpumpExtAmbientTemp].state))'
                  style:
                    font-size: 18px
                    font-weight: '700'
                    line-height: 22px
                    white-space: nowrap
              - component: Label
                config:
                  text: Außen
                  style:
                    font-size: 11px
                    opacity: '0.65'
                    line-height: 14px
      - component: div
        config:
          style:
            display: flex
            align-items: center
            gap: 14px
            margin-left: auto
        slots:
          default:
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
                align-items: center
            slots:
              default:
              - component: Label
                config:
                  text: ='Heute'
                  style:
                    font-size: 11px
                    opacity: '0.65'
                    line-height: 14px
              - component: div
                config:
                  style:
                    display: flex
                    gap: 3px
                    font-size: 13px
                    line-height: 18px
                    white-space: nowrap
                slots:
                  default:
                  - component: Label
                    config:
                      text: '=((items[props.weatherDay0Min].state !== ''UNDEF'' && items[props.weatherDay0Min].state !== ''NULL'')
                        ? Math.round(Number(items[props.weatherDay0Min].numericState)) + ''°'' : ''–'')'
                      style:
                        opacity: '0.65'
                  - component: Label
                    config:
                      text: /
                      style:
                        opacity: '0.35'
                  - component: Label
                    config:
                      text: '=((items[props.weatherDay0Max].state !== ''UNDEF'' && items[props.weatherDay0Max].state !== ''NULL'')
                        ? Math.round(Number(items[props.weatherDay0Max].numericState)) + ''°'' : ''–'')'
                      style:
                        font-weight: '700'
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
                align-items: center
            slots:
              default:
              - component: Label
                config:
                  text: =['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][dayjs().add(1, 'day').day()]
                  style:
                    font-size: 11px
                    opacity: '0.65'
                    line-height: 14px
              - component: div
                config:
                  style:
                    display: flex
                    gap: 3px
                    font-size: 13px
                    line-height: 18px
                    white-space: nowrap
                slots:
                  default:
                  - component: Label
                    config:
                      text: '=((items[props.weatherDay1Min].state !== ''UNDEF'' && items[props.weatherDay1Min].state !== ''NULL'')
                        ? Math.round(Number(items[props.weatherDay1Min].numericState)) + ''°'' : ''–'')'
                      style:
                        opacity: '0.65'
                  - component: Label
                    config:
                      text: /
                      style:
                        opacity: '0.35'
                  - component: Label
                    config:
                      text: '=((items[props.weatherDay1Max].state !== ''UNDEF'' && items[props.weatherDay1Max].state !== ''NULL'')
                        ? Math.round(Number(items[props.weatherDay1Max].numericState)) + ''°'' : ''–'')'
                      style:
                        font-weight: '700'
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
                align-items: center
            slots:
              default:
              - component: Label
                config:
                  text: =['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][dayjs().add(2, 'day').day()]
                  style:
                    font-size: 11px
                    opacity: '0.65'
                    line-height: 14px
              - component: div
                config:
                  style:
                    display: flex
                    gap: 3px
                    font-size: 13px
                    line-height: 18px
                    white-space: nowrap
                slots:
                  default:
                  - component: Label
                    config:
                      text: '=((items[props.weatherDay2Min].state !== ''UNDEF'' && items[props.weatherDay2Min].state !== ''NULL'')
                        ? Math.round(Number(items[props.weatherDay2Min].numericState)) + ''°'' : ''–'')'
                      style:
                        opacity: '0.65'
                  - component: Label
                    config:
                      text: /
                      style:
                        opacity: '0.35'
                  - component: Label
                    config:
                      text: '=((items[props.weatherDay2Max].state !== ''UNDEF'' && items[props.weatherDay2Max].state !== ''NULL'')
                        ? Math.round(Number(items[props.weatherDay2Max].numericState)) + ''°'' : ''–'')'
                      style:
                        font-weight: '700'
      - component: oh-icon
        config:
          icon: f7:chevron_right
          width: 14
          height: 14
          style:
            opacity: '0.45'
      - component: oh-link
        config:
          action: popup
          actionModal: page:forecast
          style:
            position: absolute
            inset: '0'
            display: block
            border-radius: 12px
