timestamp: Sep 30, 2026, 3:06:57 AM
component: oh-card
config:
  contentStyle:
    padding: 8px 14px
slots:
  content:
  - component: div
    config:
      style:
        position: relative
        display: flex
        align-items: center
        gap: '=screen.width < 600 ? ''8px'' : ''12px'''
        padding: 2px 4px
    slots:
      default:
      - component: div
        config:
          style:
            display: flex
            align-items: center
            gap: '=screen.width < 600 ? ''6px'' : ''8px'''
        slots:
          default:
          - component: widget:weather-icon
            config:
              symbol: =items[props.weatherSymbol].state
              day: =items[props.weatherIsDay].state !== 'OFF'
              size: 36
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
            slots:
              default:
              - component: Label
                config:
                  text: '=([''NULL'', ''UNDEF''].includes(items[props.heatpumpExtAmbientTemp].state) ? ''–'' : (items[props.heatpumpExtAmbientTemp].displayState
                    || items[props.heatpumpExtAmbientTemp].state))'
                  style:
                    font-size: 18px
                    font-weight: '700'
                    line-height: 22px
                    white-space: nowrap
              - component: Label
                config:
                  text: Außen
                  style:
                    font-size: 11px
                    opacity: '0.65'
                    line-height: 14px
          - component: div
            config:
              style:
                display: flex
                align-items: center
                gap: 4px
                border-radius: 14px
                padding: '=screen.width >= 600 ? ''0 10px 0 0'' : ''0'''
                background: '=screen.width >= 600 ? ''color-mix(in srgb, '' + ([''#9e9e9e'', ''#fdd835'', ''#fb8c00'', ''#e53935''][Number(items[props.weatherWarningLevel].state)]
                  || ''#9e9e9e'') + '' 16%, transparent)'' : ''transparent'''
              visible: =Number(items[props.weatherWarningLevel].state) > 0
            slots:
              default:
              - component: svg
                config:
                  viewBox: 0 0 28 28
                  width: '=screen.width >= 600 ? 28 : 24'
                  height: '=screen.width >= 600 ? 28 : 24'
                  style:
                    display: block
                    flex: 0 0 auto
                slots:
                  default:
                  - component: circle
                    config:
                      cx: 14
                      cy: 14
                      r: 9
                      fill: none
                      stroke: =(['#9e9e9e', '#fdd835', '#fb8c00', '#e53935'][Number(items[props.weatherWarningLevel].state)]
                        || '#9e9e9e')
                      stroke-width: 1.6
                    slots:
                      default:
                      - component: animate
                        config:
                          attributeName: r
                          values: 9;13.5
                          dur: 2.2s
                          repeatCount: indefinite
                      - component: animate
                        config:
                          attributeName: opacity
                          values: 0.7;0
                          dur: 2.2s
                          repeatCount: indefinite
                  - component: circle
                    config:
                      cx: 14
                      cy: 14
                      r: 9
                      fill: =['#9e9e9e', '#fdd835', '#fb8c00', '#e53935'][Number(items[props.weatherWarningLevel].state)]
                        || '#9e9e9e'
                  - component: rect
                    config:
                      x: 12.7
                      y: 8.6
                      width: 2.6
                      height: 6.6
                      rx: 1.3
                      fill: '=Number(items[props.weatherWarningLevel].state) === 1 ? ''#3e2723'' : ''#ffffff'''
                  - component: circle
                    config:
                      cx: 14
                      cy: 18.17
                      r: 1.35
                      fill: '=Number(items[props.weatherWarningLevel].state) === 1 ? ''#3e2723'' : ''#ffffff'''
              - component: Label
                config:
                  text: =items[props.weatherWarningText].state
                  style:
                    font-size: 12px
                    font-weight: '600'
                    white-space: nowrap
                  visible: =screen.width >= 600
      - component: div
        config:
          style:
            display: flex
            align-items: center
            gap: '=screen.width < 600 ? ''8px'' : ''14px'''
            margin-left: auto
        slots:
          default:
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
                align-items: center
            slots:
              default:
              - component: Label
                config:
                  text: ='Heute'
                  style:
                    font-size: 11px
                    opacity: '0.65'
                    line-height: 14px
              - component: div
                config:
                  style:
                    display: flex
                    align-items: center
                    gap: 3px
                slots:
                  default:
                  - component: widget:weather-icon
                    config:
                      symbol: '=((('''' + items[props.weatherDaily].state).startsWith(''['') ? JSON.parse(items[props.weatherDaily].state)
                        : []).find((d) => dayjs(d.t * 1000).isSame(dayjs().add(0, ''day''), ''day'')) || {}).sym'
                      day: =true
                      size: 24
                  - component: div
                    config:
                      style:
                        display: flex
                        flex-direction: column
                        font-size: 13px
                        white-space: nowrap
                    slots:
                      default:
                      - component: Label
                        config:
                          text: '=((items[props.weatherDay0Max].state !== ''UNDEF'' && items[props.weatherDay0Max].state !==
                            ''NULL'') ? Math.round(Number(items[props.weatherDay0Max].numericState)) + ''°'' : ''–'')'
                          style:
                            font-weight: '700'
                            line-height: 15px
                      - component: Label
                        config:
                          text: '=((items[props.weatherDay0Min].state !== ''UNDEF'' && items[props.weatherDay0Min].state !==
                            ''NULL'') ? Math.round(Number(items[props.weatherDay0Min].numericState)) + ''°'' : ''–'')'
                          style:
                            font-size: 11px
                            opacity: '0.65'
                            line-height: 13px
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
                align-items: center
            slots:
              default:
              - component: Label
                config:
                  text: =['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][dayjs().add(1, 'day').day()]
                  style:
                    font-size: 11px
                    opacity: '0.65'
                    line-height: 14px
              - component: div
                config:
                  style:
                    display: flex
                    align-items: center
                    gap: 3px
                slots:
                  default:
                  - component: widget:weather-icon
                    config:
                      symbol: '=((('''' + items[props.weatherDaily].state).startsWith(''['') ? JSON.parse(items[props.weatherDaily].state)
                        : []).find((d) => dayjs(d.t * 1000).isSame(dayjs().add(1, ''day''), ''day'')) || {}).sym'
                      day: =true
                      size: 24
                  - component: div
                    config:
                      style:
                        display: flex
                        flex-direction: column
                        font-size: 13px
                        white-space: nowrap
                    slots:
                      default:
                      - component: Label
                        config:
                          text: '=((items[props.weatherDay1Max].state !== ''UNDEF'' && items[props.weatherDay1Max].state !==
                            ''NULL'') ? Math.round(Number(items[props.weatherDay1Max].numericState)) + ''°'' : ''–'')'
                          style:
                            font-weight: '700'
                            line-height: 15px
                      - component: Label
                        config:
                          text: '=((items[props.weatherDay1Min].state !== ''UNDEF'' && items[props.weatherDay1Min].state !==
                            ''NULL'') ? Math.round(Number(items[props.weatherDay1Min].numericState)) + ''°'' : ''–'')'
                          style:
                            font-size: 11px
                            opacity: '0.65'
                            line-height: 13px
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
                align-items: center
            slots:
              default:
              - component: Label
                config:
                  text: =['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][dayjs().add(2, 'day').day()]
                  style:
                    font-size: 11px
                    opacity: '0.65'
                    line-height: 14px
              - component: div
                config:
                  style:
                    display: flex
                    align-items: center
                    gap: 3px
                slots:
                  default:
                  - component: widget:weather-icon
                    config:
                      symbol: '=((('''' + items[props.weatherDaily].state).startsWith(''['') ? JSON.parse(items[props.weatherDaily].state)
                        : []).find((d) => dayjs(d.t * 1000).isSame(dayjs().add(2, ''day''), ''day'')) || {}).sym'
                      day: =true
                      size: 24
                  - component: div
                    config:
                      style:
                        display: flex
                        flex-direction: column
                        font-size: 13px
                        white-space: nowrap
                    slots:
                      default:
                      - component: Label
                        config:
                          text: '=((items[props.weatherDay2Max].state !== ''UNDEF'' && items[props.weatherDay2Max].state !==
                            ''NULL'') ? Math.round(Number(items[props.weatherDay2Max].numericState)) + ''°'' : ''–'')'
                          style:
                            font-weight: '700'
                            line-height: 15px
                      - component: Label
                        config:
                          text: '=((items[props.weatherDay2Min].state !== ''UNDEF'' && items[props.weatherDay2Min].state !==
                            ''NULL'') ? Math.round(Number(items[props.weatherDay2Min].numericState)) + ''°'' : ''–'')'
                          style:
                            font-size: 11px
                            opacity: '0.65'
                            line-height: 13px
      - component: oh-icon
        config:
          icon: f7:chevron_right
          width: 14
          height: 14
          visible: =screen.width >= 380
          style:
            opacity: '0.45'
      - component: oh-link
        config:
          action: popup
          actionModal: page:forecast
          style:
            position: absolute
            inset: '0'
            display: block
            border-radius: 12px
