timestamp: Oct 2, 2026, 2:13:02 PM
component: oh-card
config:
  title: Steuerung
  style:
    height: calc(100% - 2 * var(--f7-card-margin-vertical))
slots:
  content:
  - component: div
    config:
      style:
        padding: 4px 16px 14px
    slots:
      default:
      - component: widget:heatpump-controls
        config:
          heatpumpDhwBoost: =props.heatpumpDhwBoost
          heatpumpDhwTankTemp: =props.heatpumpDhwTankTemp
          heatpumpPower: =props.heatpumpPower
          heatpumpClimateControlPower: =props.heatpumpClimateControlPower
          heatpumpDhwPower: =props.heatpumpDhwPower
          heatpumpManagement: =props.heatpumpManagement
      - component: widget:air-conditioner-controls
        config:
          acSwitch: =props.acSwitch
          acMode: =props.acMode
          acTemperatureSetpoint: =props.acTemperatureSetpoint
          acTemperature: =props.acTemperature
          acTimer: =props.acTimer
      - component: widget:ventilation-controls
        config:
          ventilationLevel: =props.ventilationLevel
          ventilationPower: =props.ventilationPower
          netatmoWeatherstationCo2: =props.netatmoWeatherstationCo2
          ventilationTimer: =props.ventilationTimer
          ventilationManagement: =props.ventilationManagement
      - component: div
        config:
          style:
            display: grid
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr))
            gap: 8px
            margin-top: 8px
        slots:
          default:
          - component: widget:switch-tile
            config:
              item: =props.coffeeMachineSwitch
              title: Kaffeemaschine
              icon: material:coffee
              color: '#8d6e63'
              value: =Math.round((Number(items[props.coffeeMachinePower].numericState) || 0)) + ' W'
          - component: widget:switch-tile
            config:
              item: =props.bicycleBatteriesSwitch
              title: Fahrradakkus
              icon: material:electric_bike
              color: '#7cb342'
              value: =Math.round((Number(items[props.bicycleBatteriesPower].numericState) || 0)) + ' W'
          - component: widget:switch-tile
            config:
              item: =props.office1Switch
              title: Büro 1
              icon: material:computer
              color: '#ab47bc'
              value: =Math.round((Number(items[props.office1Power].numericState) || 0)) + ' W'
          - component: widget:switch-tile
            config:
              item: =props.office2Switch
              title: Büro 2
              icon: material:computer
              color: '#ab47bc'
              value: =Math.round((Number(items[props.office2Power].numericState) || 0)) + ' W'
          - component: widget:switch-tile
            config:
              item: =props.terraceLightSwitch
              title: Terrassenlicht
              icon: material:light
              color: '#fbc02d'
              value: =Math.round((Number(items[props.terraceLightPower].numericState) || 0)) + ' W'
