uid: upper-floor-quick
tags:
- controls
props:
  parameters:
  - name: acTemperature
    label: Faikout Perfera Temperature
    description: Number:Temperature item
    type: TEXT
    required: true
    context: item
  - name: tadoHumidity
    label: Tado Humidity
    description: Number:Dimensionless item
    type: TEXT
    required: true
    context: item
  parameterGroups: []
timestamp: Oct 5, 2026, 2:14:59 AM
component: div
config:
  style:
    --quick-popup: panel
  label: Upper Floor
  stylesheet: ':root .popup:has(> .oh-popup[style*="--quick-popup"]) { --f7-popup-tablet-width: 420px; --f7-popup-tablet-height:
    min(660px, calc(100vh - 64px)); }

    .menu-item-dropdown:not(.menu-item-dropdown-opened) .menu-dropdown { display: none; }

    .oh-chart-container > .menu.padding { padding-top: 6px !important; }'
slots:
  default:
  - component: div
    config:
      style:
        display: flex
        flex-direction: column
        gap: 6px
        padding: 12px 14px
    slots:
      default:
      - component: div
        config:
          style:
            display: flex
            align-items: center
            gap: 10px
            padding-bottom: 4px
        slots:
          default:
          - component: div
            config:
              style:
                width: 34px
                height: 34px
                flex: 0 0 auto
                border-radius: 50%
                display: flex
                align-items: center
                justify-content: center
                background: 'color-mix(in srgb, #f48fb1 22%, transparent)'
            slots:
              default:
              - component: oh-icon
                config:
                  icon: material:bed
                  width: 20
                  height: 20
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
                min-width: '0'
            slots:
              default:
              - component: Label
                config:
                  text: Upper Floor
                  style:
                    font-size: 15px
                    font-weight: '600'
              - component: Label
                config:
                  text: '=([''NULL'', ''UNDEF''].includes(items[props.acTemperature].state) ? ''–'' : (items[props.acTemperature].displayState
                    || items[props.acTemperature].state)) + '' · '' + ([''NULL'', ''UNDEF''].includes(items[props.tadoHumidity].state)
                    ? ''–'' : ((Number(items[props.tadoHumidity].numericState) || 0)).toFixed(0) + '' %'')'
                  style:
                    font-size: 12px
                    opacity: '0.7'
                    white-space: nowrap
                    overflow: hidden
                    text-overflow: ellipsis
      - component: oh-chart
        config:
          chartType: ''
          periodVisible: true
          period: D
          height: 392px
          options:
            backgroundColor: transparent
            axisPointer:
              link:
              - xAxisIndex: all
        slots:
          grid:
          - component: oh-chart-grid
            config:
              top: 62
              height: 120
              left: '50'
              right: '20'
          - component: oh-chart-grid
            config:
              top: 242
              height: 120
              left: '50'
              right: '20'
          xAxis:
          - component: oh-time-axis
            config:
              gridIndex: 0
              axisPointer:
                snap: false
                label:
                  show: false
              axisLabel:
                show: false
          - component: oh-time-axis
            config:
              gridIndex: 1
              axisPointer:
                snap: false
                label:
                  show: false
          yAxis:
          - component: oh-value-axis
            config:
              gridIndex: 0
              name: °C
              nameGap: 14
              nameTextStyle:
                align: right
                padding:
                - 0
                - 8
                - 0
                - 0
              splitLine:
                lineStyle:
                  type: dashed
                  opacity: 0.4
              scale: true
              min: =(v) => Math.floor(Math.min(v.min, (v.min + v.max - 4) / 2))
              max: =(v) => Math.ceil(Math.max(v.max, (v.min + v.max + 4) / 2))
          - component: oh-value-axis
            config:
              gridIndex: 1
              name: '%'
              nameGap: 14
              nameTextStyle:
                align: right
                padding:
                - 0
                - 8
                - 0
                - 0
              splitLine:
                lineStyle:
                  type: dashed
                  opacity: 0.4
              scale: true
              min: =(v) => Math.floor(Math.min(v.min, (v.min + v.max - 10) / 2))
              max: =(v) => Math.ceil(Math.max(v.max, (v.min + v.max + 10) / 2))
          series:
          - component: oh-time-series
            config:
              name: Temperature
              gridIndex: 0
              xAxisIndex: 0
              yAxisIndex: 0
              type: line
              item: =props.acTemperature
              symbol: none
              lineStyle:
                width: 2
                color: '#f48fb1'
              itemStyle:
                color: '#f48fb1'
          - component: oh-time-series
            config:
              name: Humidity
              gridIndex: 1
              xAxisIndex: 1
              yAxisIndex: 1
              type: line
              item: =props.tadoHumidity
              symbol: none
              lineStyle:
                width: 2
                color: '#4fc3f7'
              itemStyle:
                color: '#4fc3f7'
          title:
          - component: oh-chart-title
            config:
              show: true
              text: Temperature
              left: 10
              top: 15
              textStyle:
                fontSize: 13
                fontWeight: 600
          - component: oh-chart-title
            config:
              show: true
              text: Humidity
              left: 10
              top: 190
              textStyle:
                fontSize: 13
                fontWeight: 600
          tooltip:
          - component: oh-chart-tooltip
            config:
              show: true
              confine: true
              trigger: axis
              smartFormatter: true
      - component: div
        config:
          style:
            display: flex
            justify-content: flex-end
            padding-top: 4px
        slots:
          default:
          - component: oh-button
            config:
              text: All details
              action: popup
              actionModal: page:air_conditioning
              outline: true
              small: true
              style:
                color: '#f48fb1'
                border-color: '#f48fb1'
                width: auto
                padding: 0 12px
