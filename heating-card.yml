                          cx: 0.0
                          cy: 0.0
                          fill: none
                          r: 29.2
                          stroke: '#e57373'
                          stroke-width: 4.5
                          visible: =((((items[props.heatpumpWaterPumpOperation].state === 'ON' || (Number(items[props.heatpumpFlowSensor].numericState)
                            || 0) > 0) && (items[props.heatpumpValve].state === 'DHW')) || items[props.heatpumpBshMode].state
                            === 'ON')) && !((((Number(items[props.heatpumpDhwTankTemp].numericState) || 0) - 20) / 40) > 0.01)
                      - component: circle
                        config:
                          class: a-soft
                          cx: 0.0
                          cy: 0.0
                          fill: none
                          r: 29.2
                          stroke: '#e57373'
                          stroke-width: 2.9
                          visible: =((((items[props.heatpumpWaterPumpOperation].state === 'ON' || (Number(items[props.heatpumpFlowSensor].numericState)
                            || 0) > 0) && (items[props.heatpumpValve].state === 'DHW')) || items[props.heatpumpBshMode].state
                            === 'ON')) && ((((Number(items[props.heatpumpDhwTankTemp].numericState) || 0) - 20) / 40) > 0.01)
                  - component: g
                    config:
                      visible: =((Number(items[props.heatpumpDhwTankTemp].numericState) || 0) - 20) / 40 > 0.01
                    slots:
                      default:
                      - component: circle
                        config:
