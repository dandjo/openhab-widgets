  title: Heating & Hot Water
slots:
  content:
  - component: div
    config:
      style:
        font-size: 14px
        padding: 12px 16px 16px
    slots:
      default:
      - component: div
        config:
          style:
            display: grid
            gap: 10px
            grid-template-columns: 1fr 1fr
            margin-bottom: 16px
        slots:
          default:
          - component: div
            config:
              style:
                align-items: center
                background: color-mix(in srgb, var(--f7-text-color) 6%, transparent)
                border-radius: 12px
                display: flex
                flex-direction: column
                gap: 6px
                justify-content: center
                padding: 12px 8px
                position: relative
                text-align: center
            slots:
              default:
              - component: svg
                config:
                  height: 68.0
                  style:
                    display: block
                    overflow: visible
                  viewBox: -34.0 -34.0 68 68
                  width: 68.0
                slots:
                  default:
                  - component: defs
                    config: {}
                    slots:
                      default:
                      - component: linearGradient
                        config:
                          id: heatTank
                          x1: '0'
                          x2: '0'
                          y1: '0'
                          y2: '1'
                        slots:
                          default:
                          - component: stop
                            config:
                              offset: 0%
                              stop-color: '=(Number(items[props.heatpumpDhwTankTemp].numericState) || 0) >= 50 ? ''#ef9a9a''
                                : (Number(items[props.heatpumpDhwTankTemp].numericState) || 0) >= 40 ? ''#ffab91'' : (Number(items[props.heatpumpDhwTankTemp].numericState)
                                || 0) >= 30 ? ''#ffe0b2'' : ''#bbdefb'''
                              stop-opacity: '0.9'
                          - component: stop
                            config:
                              offset: 33%
                              stop-color: '=(Number(items[props.heatpumpDhwTankTemp].numericState) || 0) >= 50 ? ''#ef9a9a''
                                : (Number(items[props.heatpumpDhwTankTemp].numericState) || 0) >= 40 ? ''#ffab91'' : (Number(items[props.heatpumpDhwTankTemp].numericState)
                                || 0) >= 30 ? ''#ffe0b2'' : ''#bbdefb'''
                              stop-opacity: '0.9'
                          - component: stop
                            config:
                              offset: 33%
                              stop-color: '#ffcc80'
                              stop-opacity: '0.9'
                          - component: stop
                            config:
                              offset: 66%
                              stop-color: '#ffcc80'
                              stop-opacity: '0.9'
                          - component: stop
                            config:
                              offset: 66%
                              stop-color: '#bbdefb'
                              stop-opacity: '0.9'
                          - component: stop
                            config:
                              offset: 100%
                              stop-color: '#bbdefb'
                              stop-opacity: '0.9'
                  - component: g
                    config: {}
                    slots:
                      default:
                      - component: circle
                        config:
                          cx: 0.0
                          cy: 0.0
                          r: 32.25
                          style:
                            fill: 'var(--f7-card-bg-color, #fff)'
                      - component: circle
                        config:
                          cx: 0.0
                          cy: 0.0
                          fill: none
                          r: 29.2
                          stroke: rgba(127, 127, 127, 0.28)
                          stroke-width: 2.9
                  - component: g
                    config: {}
                    slots:
                      default:
                      - component: circle
                        config:
                          class: a-full
                          cx: 0.0
                          cy: 0.0
                          fill: none
                          r: 29.2
                          stroke: '#e57373'
                          stroke-width: 2.9
                          visible: =((((items[props.heatpumpWaterPumpOperation].state === 'ON' || (Number(items[props.heatpumpFlowSensor].numericState)
                            || 0) > 0) && (items[props.heatpumpValve].state === 'DHW')) || items[props.heatpumpBshMode].state
                            === 'ON')) && !((((Number(items[props.heatpumpDhwTankTemp].numericState) || 0) - 20) / 40) > 0.01)
                      - component: circle
