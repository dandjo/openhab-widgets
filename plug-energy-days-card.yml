uid: plug-energy-days-card
tags:
- plug
props:
  parameters:
  - name: prefix
    label: Item prefix
    description: 'Name prefix of the plug''s items: <prefix>_power, _switch, _energy_today, _energy_total, _voltage, _current,
      _power_factor, _apparent_power, _reactive_power'
    type: TEXT
    required: true
  - name: color
    label: Colour
    description: 'Device colour as #rrggbb'
    type: TEXT
    required: false
    default: '#8d6e63'
  parameterGroups: []
timestamp: Oct 10, 2026, 3:26:17 PM
component: oh-card
config:
  title: Energy per Day
