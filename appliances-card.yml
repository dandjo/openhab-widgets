timestamp: Sep 27, 2026, 9:44:33 PM
component: oh-card
config:
  title: Haushaltsgeräte
  style:
    height: calc(100% - 2 * var(--f7-card-margin-vertical))
    display: flex
    flex-direction: column
  contentStyle:
    flex: 1 1 auto
    display: flex
    flex-direction: column
slots:
  content:
  - component: div
    config:
      style:
        display: grid
        grid-template-columns: 1fr 1fr
        grid-auto-rows: 1fr
        gap: 10px
        padding: 12px 16px 16px
        flex: 1 1 auto
    slots:
      default:
      - component: widget:appliance-tile
        config:
          kind: washer
          title: Waschmaschine 1
          popup: appliance_washing_machine_1
          progress: =props.washer1ProgramProgress
          state: =props.washer1OperationState
          program: =props.washer1ActiveProgram
          phase: =props.washer1ProgramPhase
          finished: =props.washer1ProgramFinishedTime
          remaining: =props.washer1ProgramRemainingTime
      - component: widget:appliance-tile
        config:
          kind: washer
          title: Waschmaschine 2
          popup: appliance_washing_machine_2
          power: =props.washingMachine2Power
          done: =props.washingMachine2Finished
      - component: widget:appliance-tile
        config:
          kind: dryer
          title: Wäschetrockner
          popup: appliance_tumble_dryer
          progress: =props.dryerProgramProgress
          state: =props.dryerOperationState
          program: =props.dryerActiveProgram
          phase: =props.dryerProgramPhase
          finished: =props.dryerProgramFinishedTime
          remaining: =props.dryerProgramRemainingTime
      - component: widget:appliance-tile
        config:
          kind: dish-washer
          title: Geschirrspüler
          popup: appliance_dishwasher
          progress: =props.dishwasherProgramProgress
          state: =props.dishwasherOperationState
          program: =props.dishwasherActiveProgram
          phase: =props.dishwasherProgramPhase
          finished: =props.dishwasherProgramFinishedTime
          remaining: =props.dishwasherProgramRemainingTime
