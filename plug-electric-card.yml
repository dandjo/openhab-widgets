uid: plug-electric-card
tags:
- plug
props:
  parameters:
  - name: prefix
    label: Item prefix
    description: 'Name prefix of the plug''s items: <prefix>_power, _switch, _energy_today, _energy_total, _voltage, _current,
      _power_factor, _apparent_power, _reactive_power'
    type: TEXT
    required: true
  - name: title
    label: Title
    description: Card title
    type: TEXT
    required: false
    default: Elektrisch
  parameterGroups: []
timestamp: Sep 27, 2026, 7:07:59 PM
component: oh-card
config:
  title: =props.title
  style:
    height: calc(100% - 2 * var(--f7-card-margin-vertical))
slots:
  content:
  - component: div
    config:
      style:
        display: grid
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr))
        gap: 10px
        padding: 4px 16px 16px
    slots:
      default:
      - component: widget:value-tile
        config:
          title: Spannung
          value: '=(([''NULL'', ''UNDEF''].includes(items[props.prefix + ''_voltage''].state) ? ''–'' : (items[props.prefix
            + ''_voltage''].displayState || items[props.prefix + ''_voltage''].state)) || ''–'')'
          icon: material:power_input
          iconColor: '#ffa000'
          item: =props.prefix + '_voltage'
          kind: number
      - component: widget:value-tile
        config:
          title: Strom
          value: '=(([''NULL'', ''UNDEF''].includes(items[props.prefix + ''_current''].state) ? ''–'' : (items[props.prefix
            + ''_current''].displayState || items[props.prefix + ''_current''].state)) || ''–'')'
          icon: material:cable
          iconColor: '#ffa000'
          item: =props.prefix + '_current'
          kind: number
      - component: widget:value-tile
        config:
          title: Leistungsfaktor
          value: '=(([''NULL'', ''UNDEF''].includes(items[props.prefix + ''_power_factor''].state) ? ''–'' : (items[props.prefix
            + ''_power_factor''].displayState || items[props.prefix + ''_power_factor''].state)) || ''–'')'
          icon: material:functions
          iconColor: '#90a4ae'
          item: =props.prefix + '_power_factor'
          kind: number
      - component: widget:value-tile
        config:
          title: Scheinleistung
          value: '=(([''NULL'', ''UNDEF''].includes(items[props.prefix + ''_apparent_power''].state) ? ''–'' : (items[props.prefix
            + ''_apparent_power''].displayState || items[props.prefix + ''_apparent_power''].state)) || ''–'')'
          icon: material:bolt
          iconColor: '#90a4ae'
          item: =props.prefix + '_apparent_power'
          kind: number
      - component: widget:value-tile
        config:
          title: Blindleistung
          value: '=(([''NULL'', ''UNDEF''].includes(items[props.prefix + ''_reactive_power''].state) ? ''–'' : (items[props.prefix
            + ''_reactive_power''].displayState || items[props.prefix + ''_reactive_power''].state)) || ''–'')'
          icon: material:bolt
          iconColor: '#90a4ae'
          item: =props.prefix + '_reactive_power'
          kind: number
