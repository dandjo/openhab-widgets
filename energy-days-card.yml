uid: energy-days-card
tags:
- overview
props:
  parameters:
  - name: dailySelfUse
    label: Energy Daily Self Use
    description: Number:Energy item
    type: TEXT
    required: true
    context: item
  - name: dailyGridImport
    label: Energy Daily Grid Import
    description: Number:Energy item
    type: TEXT
    required: true
    context: item
  - name: dailyPv
    label: Energy Daily PV
    description: Number:Energy item
    type: TEXT
    required: true
    context: item
  parameterGroups: []
timestamp: Oct 10, 2026, 5:24:26 PM
component: oh-card
config:
  title: Energy per Day
  style:
    height: calc(100% - 2 * var(--f7-card-margin-vertical))
    display: flex
    flex-direction: column
  contentStyle:
    flex: 1 1 auto
    display: flex
    flex-direction: column
  stylesheet: '.menu-item-dropdown:not(.menu-item-dropdown-opened) .menu-dropdown { display: none; }

    .oh-chart-container > .menu.padding { padding-top: 6px !important; }'
slots:
  content:
  - component: div
    config:
      style:
        position: relative
        flex: 1 1 auto
        min-height: 340px
    slots:
      default:
      - component: div
        config:
          style:
            position: absolute
            inset: '0'
        slots:
          default:
          - component: oh-chart
            config:
              chartType: month
              periodVisible: true
              height: 100%
              options:
                backgroundColor: transparent
            slots:
              grid:
              - component: oh-chart-grid
                config:
                  top: '62'
                  bottom: '70'
                  left: '45'
                  right: '20'
              xAxis:
              - component: oh-category-axis
                config:
                  gridIndex: 0
                  categoryType: month
                  name: Day
                  nameGap: 12
                  axisTick:
                    show: false
              yAxis:
              - component: oh-value-axis
                config:
                  gridIndex: 0
                  name: kWh
                  nameGap: 14
                  nameTextStyle:
                    align: right
                    padding:
                    - 0
                    - 8
                    - 0
                    - 0
                  splitLine:
                    lineStyle:
                      type: dashed
                      opacity: 0.4
              series:
              - component: oh-aggregate-series
                config:
                  name: From PV
                  gridIndex: 0
                  xAxisIndex: 0
                  yAxisIndex: 0
                  type: bar
                  item: =props.dailySelfUse
                  aggregationFunction: last
                  dimension1: date
                  itemStyle:
                    color: '#81c784'
                  stack: home
              - component: oh-aggregate-series
                config:
                  name: From the grid
                  gridIndex: 0
                  xAxisIndex: 0
                  yAxisIndex: 0
                  type: bar
                  item: =props.dailyGridImport
                  aggregationFunction: last
                  dimension1: date
                  itemStyle:
                    color: '#e57373'
                    borderRadius:
                    - 4
                    - 4
                    - 0
                    - 0
                  stack: home
              - component: oh-aggregate-series
                config:
                  name: PV yield
                  gridIndex: 0
                  xAxisIndex: 0
                  yAxisIndex: 0
                  type: line
                  item: =props.dailyPv
                  aggregationFunction: last
                  dimension1: date
                  itemStyle:
                    color: '#ffa000'
                  symbol: circle
                  symbolSize: 7
                  lineStyle:
                    width: 2.5
                    color: '#ffa000'
