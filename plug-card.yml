uid: plug-card
tags:
- plug
props:
  parameters:
  - name: prefix
    label: Item prefix
    description: 'Name prefix of the plug''s items: <prefix>_power, _switch, _energy_today, _energy_total, _voltage, _current,
      _power_factor, _apparent_power, _reactive_power'
    type: TEXT
    required: true
  - name: title
    label: Title
    description: Card title, the device's name where the card is not a plug
    type: TEXT
    required: false
    default: Plug
  - name: icon
    label: Icon
    description: Device icon, e.g. material:coffee
    type: TEXT
    required: false
    default: material:power
  - name: color
    label: Colour
    description: 'Device colour as #rrggbb'
    type: TEXT
    required: false
    default: '#8d6e63'
  - name: controllable
    label: Switchable
    description: Show the plug's switch
    type: BOOLEAN
    required: false
    default: 'true'
  - name: note
    label: Note
    description: Small print under the energies, hidden when empty
    type: TEXT
    required: false
  - name: switch
    label: Switch item
    description: The switch's item where it is not <prefix>_switch, e.g. a shared meter's
    type: TEXT
    required: false
    context: item
  - name: kind
    label: Drawing
    description: 'The device drawn in its icon: an energy-flow node or an appliance; empty: the icon above'
    type: TEXT
    required: false
    limitToOptions: true
    options:
    - value: pv
      label: pv
    - value: grid
      label: grid
    - value: home
      label: home
    - value: heat-pump
      label: heat-pump
    - value: heat-pump-split
      label: heat-pump-split
    - value: air-conditioner
      label: air-conditioner
    - value: e-car
      label: e-car
    - value: battery
      label: battery
    - value: appliances
      label: appliances
    - value: ventilation
      label: ventilation
    - value: coffee-machine
      label: coffee-machine
    - value: refrigerator
      label: refrigerator
    - value: media
      label: media
    - value: office
      label: office
    - value: terrace-light
      label: terrace-light
    - value: e-bike
      label: e-bike
    - value: network-rack
      label: network-rack
    - value: washer
      label: washer
    - value: dryer
      label: dryer
    - value: dish-washer
      label: dish-washer
  - name: threshold
    label: Active from
    description: Watts above which the icon's ring pulses
    type: INTEGER
    required: false
    default: '10'
  - name: active
    label: Active
    description: Whether the device works, instead of the threshold; usually an expression
    type: BOOLEAN
    required: false
  - name: frequency
    label: Frequency
    description: The heat pump's compressor frequency, turning its drawing's fan; usually an expression
    type: DECIMAL
    required: false
  - name: progress
    label: Progress
    description: An appliance's programme progress in %, filling its ring; usually an expression
    type: DECIMAL
    required: false
  - name: range
    label: Range
    description: 'kWh per 100 km of a car: today''s charge shown as the kilometres it drives'
    type: DECIMAL
    required: false
  - name: history
    label: History item
    description: The String item the rule tile_history writes the tiles' history into (comparison with yesterday)
    type: TEXT
    required: false
    context: item
  parameterGroups: []
