uid: plug-card
tags:
- plug
props:
  parameters:
  - name: prefix
    label: Item prefix
    description: 'Name prefix of the plug''s items: <prefix>_power, _switch, _energy_today, _energy_total, _voltage, _current,
      _power_factor, _apparent_power, _reactive_power'
    type: TEXT
    required: true
  - name: title
    label: Title
    description: Card title, the device's name where the card is not a plug
    type: TEXT
    required: false
    default: Plug
  - name: icon
    label: Icon
    description: Device icon, e.g. material:coffee
    type: TEXT
    required: false
    default: material:power
  - name: color
    label: Colour
    description: 'Device colour as #rrggbb'
    type: TEXT
    required: false
    default: '#8d6e63'
  - name: controllable
    label: Switchable
    description: Show the plug's switch
    type: BOOLEAN
    required: false
    default: 'true'
  - name: note
    label: Note
    description: Small print under the energies, hidden when empty
    type: TEXT
    required: false
  - name: switch
    label: Switch item
    description: The switch's item where it is not <prefix>_switch, e.g. a shared meter's
    type: TEXT
    required: false
    context: item
  - name: kind
    label: Drawing
    description: 'The device drawn in its icon: an energy-flow node or an appliance; empty: the icon above'
    type: TEXT
    required: false
    limitToOptions: true
    options:
    - value: pv
      label: pv
    - value: grid
      label: grid
    - value: home
      label: home
    - value: heat-pump
      label: heat-pump
    - value: heat-pump-split
      label: heat-pump-split
    - value: air-conditioner
      label: air-conditioner
    - value: e-car
      label: e-car
    - value: battery
      label: battery
    - value: appliances
      label: appliances
    - value: ventilation
      label: ventilation
    - value: washer
      label: washer
    - value: dryer
      label: dryer
    - value: dish-washer
      label: dish-washer
  - name: threshold
    label: Active from
    description: Watts above which the icon's ring pulses
    type: INTEGER
    required: false
    default: '10'
  - name: active
    label: Active
    description: Whether the device works, instead of the threshold; usually an expression
    type: BOOLEAN
    required: false
  - name: frequency
    label: Frequency
    description: The heat pump's compressor frequency, turning its drawing's fan; usually an expression
    type: DECIMAL
    required: false
  - name: progress
    label: Progress
    description: An appliance's programme progress in %, filling its ring; usually an expression
    type: DECIMAL
    required: false
  parameterGroups: []
timestamp: Oct 5, 2026, 3:36:33 PM
component: oh-card
config:
  title: =props.title
  style:
    height: calc(100% - 2 * var(--f7-card-margin-vertical))
slots:
  content:
  - component: div
    config:
      style:
        display: flex
        align-items: center
        gap: 18px
        padding: 12px 16px 8px
    slots:
      default:
      - component: div
        config:
          style:
            flex: 0 0 auto
        slots:
          default:
          - component: widget:appliance-icon
            config:
              kind: =props.kind
              running: '=((props.active !== undefined && props.active !== null && props.active !== '''') ? (props.active ===
                true || props.active === ''true'') : (Number(items[props.prefix + ''_power''].numericState) || 0) > (Number(props.threshold)
                || 10))'
              progress: =props.progress
              size: 104
              visible: =['washer', 'dryer', 'dish-washer'].includes(props.kind)
          - component: svg
            config:
              viewBox: -34 -34 68 68
              width: 104
              height: 104
              style:
                display: block
                flex: 0 0 auto
                overflow: visible
              visible: =!['washer', 'dryer', 'dish-washer'].includes(props.kind)
            slots:
              default:
              - component: g
                config: {}
                slots:
                  default:
                  - component: circle
                    config:
                      cx: 0
                      cy: 0
                      r: 32.25
                      style:
                        fill: 'var(--f7-card-bg-color, #fff)'
                  - component: circle
                    config:
                      cx: 0
                      cy: 0
                      r: 29.2
                      fill: none
                      stroke: rgba(127, 127, 127, 0.28)
                      stroke-width: 2.9
              - component: g
                config: {}
                slots:
                  default:
                  - component: circle
                    config:
                      cx: 0
                      cy: 0
                      r: 29.2
                      fill: none
                      stroke: =props.color
                      stroke-width: 2.9
                      visible: '=(((props.active !== undefined && props.active !== null && props.active !== '''') ? (props.active
                        === true || props.active === ''true'') : (Number(items[props.prefix + ''_power''].numericState) ||
                        0) > (Number(props.threshold) || 10))) && !(false)'
                    slots:
                      default:
                      - component: animate
                        config:
                          attributeName: opacity
                          values: 0.3;1;0.3
                          dur: 2s
                          repeatCount: indefinite
                          visible: '=(((props.active !== undefined && props.active !== null && props.active !== '''') ? (props.active
                            === true || props.active === ''true'') : (Number(items[props.prefix + ''_power''].numericState)
                            || 0) > (Number(props.threshold) || 10))) && !(false)'
                      - component: animate
                        config:
                          attributeName: stroke-width
                          values: 2.9;4.5;2.9
                          dur: 2s
                          repeatCount: indefinite
                          visible: '=(((props.active !== undefined && props.active !== null && props.active !== '''') ? (props.active
                            === true || props.active === ''true'') : (Number(items[props.prefix + ''_power''].numericState)
                            || 0) > (Number(props.threshold) || 10))) && !(false)'
                      - component: animate
                        config:
                          attributeName: r
                          values: 29.2;30;29.2
                          dur: 2s
                          repeatCount: indefinite
                          visible: '=(((props.active !== undefined && props.active !== null && props.active !== '''') ? (props.active
                            === true || props.active === ''true'') : (Number(items[props.prefix + ''_power''].numericState)
                            || 0) > (Number(props.threshold) || 10))) && !(false)'
                  - component: circle
                    config:
                      cx: 0
                      cy: 0
                      r: 29.2
                      fill: none
                      stroke: =props.color
                      stroke-width: 2.9
                      visible: '=(((props.active !== undefined && props.active !== null && props.active !== '''') ? (props.active
                        === true || props.active === ''true'') : (Number(items[props.prefix + ''_power''].numericState) ||
                        0) > (Number(props.threshold) || 10))) && (false)'
                    slots:
                      default:
                      - component: animate
                        config:
                          attributeName: opacity
                          values: 0.3;0.06;0.3
                          dur: 2s
                          repeatCount: indefinite
                          visible: '=(((props.active !== undefined && props.active !== null && props.active !== '''') ? (props.active
                            === true || props.active === ''true'') : (Number(items[props.prefix + ''_power''].numericState)
                            || 0) > (Number(props.threshold) || 10))) && (false)'
              - component: widget:flow-node
                config:
                  kind: =props.kind
                  x: 0
                  y: 0
                  power: '=(((props.active !== undefined && props.active !== null && props.active !== '''') ? (props.active
                    === true || props.active === ''true'') : (Number(items[props.prefix + ''_power''].numericState) || 0)
                    > (Number(props.threshold) || 10))) ? (Number(items[props.prefix + ''_power''].numericState) || 0) : 0'
                  frequency: =props.frequency
                  visible: =(!!props.kind && !['washer', 'dryer', 'dish-washer'].includes(props.kind))
              - component: g
                config:
                  visible: =!(!!props.kind && !['washer', 'dryer', 'dish-washer'].includes(props.kind))
                slots:
                  default:
                  - component: g
                    config: {}
                    slots:
                      default:
                      - component: circle
                        config:
                          cx: 0
                          cy: 0
                          r: 27.75
                          style:
                            fill: 'var(--f7-card-bg-color, #fff)'
                      - component: circle
                        config:
                          cx: 0
                          cy: 0
                          r: 27.75
                          fill: =props.color
                          fill-opacity: '0.12'
                  - component: text
                    config:
                      x: 0
                      y: 0
                      content: =(props.icon).replace('material:', '')
                      fill: =props.color
                      font-size: 30
                      text-anchor: middle
                      dominant-baseline: central
                      style:
                        font-family: '''Material Icons'''
                        font-feature-settings: '''liga'''
      - component: div
        config:
          style:
            display: flex
            flex-direction: column
            align-items: flex-start
            gap: 3px
            min-width: '0'
        slots:
          default:
          - component: Label
            config:
              text: Power
              style:
                font-size: 12px
                opacity: '0.7'
          - component: Label
            config:
              text: '=([''NULL'', ''UNDEF''].includes(items[props.prefix + ''_power''].state) ? ''–'' : (items[props.prefix
                + ''_power''].displayState || items[props.prefix + ''_power''].state))'
              style:
                font-size: 30px
                font-weight: '700'
                line-height: 34px
                white-space: nowrap
          - component: Label
            config:
              text: '=items[(props.switch || props.prefix + ''_switch'')].state === ''ON'' ? ''On'' : ''Off'''
              style:
                background: '=items[(props.switch || props.prefix + ''_switch'')].state === ''ON'' ? props.color : ''#9e9e9e'''
                color: '#ffffff'
                border-radius: 10px
                padding: 2px 10px
                font-size: 12px
                font-weight: '600'
                white-space: nowrap
  - component: div
    config:
      style:
        padding: 4px 16px 12px
      visible: =props.controllable !== false && props.controllable !== 'false'
    slots:
      default:
      - component: widget:power-pill
        config:
          item: =(props.switch || props.prefix + '_switch')
          color: =props.color
          onText: ='On'
  - component: div
    config:
      style:
        display: grid
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr))
        gap: 10px
        padding: 4px 16px 16px
    slots:
      default:
      - component: widget:value-tile
        config:
          title: Energy today
          value: '=(([''NULL'', ''UNDEF''].includes(items[props.prefix + ''_energy_today''].state) ? ''–'' : (items[props.prefix
            + ''_energy_today''].displayState || items[props.prefix + ''_energy_today''].state)) || ''–'')'
          icon: material:offline_bolt
          iconColor: '#ffa726'
          item: =props.prefix + '_energy_today'
          kind: number
      - component: widget:value-tile
        config:
          title: Energy total
          value: '=(([''NULL'', ''UNDEF''].includes(items[props.prefix + ''_energy_total''].state) ? ''–'' : (items[props.prefix
            + ''_energy_total''].displayState || items[props.prefix + ''_energy_total''].state)) || ''–'')'
          icon: material:offline_bolt
          iconColor: '#ffa726'
          item: =props.prefix + '_energy_total'
          kind: number
  - component: Label
    config:
      text: =props.note
      style:
        font-size: 12px
        opacity: '0.6'
        padding: 0 16px 14px
      visible: =!!props.note
