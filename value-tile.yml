uid: value-tile
tags:
- tile
props:
  parameters:
  - name: title
    label: Title
    description: Title above the value
    type: TEXT
    required: true
  - name: value
    label: Value
    description: The text to show, usually an expression on an item
    type: TEXT
    required: true
  - name: color
    label: Colour
    description: 'Colour of the item popup''s course as #rrggbb'
    type: TEXT
    required: false
  - name: item
    label: Item
    description: 'The item whose popup a tap opens; empty: no tap'
    type: TEXT
    required: false
    context: item
  - name: action
    label: Action
    description: 'popup: the item popup (widget item-popup); options: the item''s command options'
    type: TEXT
    required: false
    default: popup
  - name: kind
    label: Kind
    description: 'What the item popup shows: number, state or none'
    type: TEXT
    required: false
    default: number
  - name: states
    label: State labels
    description: value=label pairs, comma-separated, for the item popup's band of states
    type: TEXT
    required: false
  - name: wrap
    label: Wrap
    description: A long text wraps across the whole row of the grid instead of being cut
    type: BOOLEAN
    required: false
  - name: fontSize
    label: Font size
    description: The tile's base size, e.g. 1.1em to grow with its card; default 14px
    type: TEXT
    required: false
  parameterGroups: []
timestamp: Oct 25, 2026, 2:07:58 PM
component: div
config:
