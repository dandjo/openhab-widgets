slots:
  default:
  - component: div
    config:
      style:
        position: relative
    slots:
      default:
      - component: Label
        config:
          text: =props.title
          style:
            font-size: 0.8571em
            opacity: '0.65'
      - component: Label
        config:
          text: =props.value
          style:
            font-size: '=props.wrap ? ''1em'' : ''1.429em'''
            font-weight: '=props.wrap ? 600 : 700'
            line-height: '=props.wrap ? ''1.357'' : ''1.3'''
            white-space: '=props.wrap ? ''normal'' : ''nowrap'''
            overflow: hidden
            text-overflow: '=props.wrap ? ''clip'' : ''ellipsis'''
            overflow-wrap: anywhere
  - component: oh-link
    config:
      visible: =!!props.item
      action: =props.action || 'popup'
      actionItem: =props.item
      actionModal: widget:item-popup
      actionModalConfig:
        item: =props.item
        title: =props.title
        color: =props.color || '#5c6bc0'
        kind: =props.kind || 'number'
        states: =props.states || ''
      style:
        position: absolute
        inset: '0'
        display: block
        border-radius: 0.8571em
