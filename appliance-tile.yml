uid: appliance-tile
tags:
- appliance
props:
  parameters:
  - description: The appliance drawn
    label: Kind
    name: kind
    required: true
    type: TEXT
    limitToOptions: true
    options:
    - label: washer
      value: washer
    - label: dryer
      value: dryer
    - label: dish-washer
      value: dish-washer
  - description: The appliance's name
    label: Title
    name: title
    required: true
    type: TEXT
  - description: The uid of the page a tap opens as a popup
    label: Popup
    name: popup
    required: true
    type: TEXT
  - context: item
    description: Miele item _program_progress, e.g. miele_washing_machine_program_progress; set for a Miele machine
    label: Progress
    name: progress
    required: false
    type: TEXT
  - context: item
    description: Miele item _operation_state, e.g. miele_washing_machine_operation_state; set for a Miele machine
    label: State
    name: state
    required: false
    type: TEXT
  - context: item
    description: Miele item _active_program, e.g. miele_washing_machine_active_program; set for a Miele machine
    label: Program
    name: program
    required: false
    type: TEXT
  - context: item
    description: Miele item _program_phase, e.g. miele_washing_machine_program_phase; set for a Miele machine
    label: Phase
    name: phase
    required: false
    type: TEXT
  - context: item
    description: Miele item _program_finished_time, e.g. miele_washing_machine_program_finished_time; set for a Miele machine
    label: Finished
    name: finished
    required: false
    type: TEXT
  - context: item
    description: Miele item _program_remaining_time, e.g. miele_washing_machine_program_remaining_time; set for a Miele machine
    label: Remaining
    name: remaining
    required: false
    type: TEXT
  - context: item
    description: The plug's power item, for a machine without program data
    label: Power item
    name: power
    required: false
    type: TEXT
  - context: item
    description: Switch item that is on while the plug machine is finished
    label: Finished item
    name: done
    required: false
    type: TEXT
  - context: item
    description: DateTime item holding since when the plug machine runs (UNDEF at rest)
    label: Running since item
    name: since
    required: false
    type: TEXT
  parameterGroups: []
